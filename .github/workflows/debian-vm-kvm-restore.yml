name: Read-only KVM snapshot portability
on:
  push:
    branches: [ci/debian13-snapshot-vm]
    paths: [.github/workflows/debian-vm-kvm-restore.yml]
permissions:
  contents: read
  actions: read
jobs:
  restore-only:
    if: startsWith(github.event.head_commit.message, '[vm-kvm-restore] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa95a619c62e5692661d0991a855249186ae4138
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: debian13-reviewed-snapshot
          path: vm-state
          run-id: 40971706077
          github-token: ${{ github.token }}
      - run: docker build -t udm-vm-tooling tests/vm
      - name: Restore original running guest without installation
        run: |
          test -c /dev/kvm
          lscpu > vm-state/runner-cpu.txt
          docker run --rm -i --device /dev/kvm --entrypoint /usr/bin/python3 \
            --mount type=bind,src="$PWD",dst=/source,readonly \
            --mount type=bind,src="$PWD/vm-state",dst=/state udm-vm-tooling - <<'PY'
          import importlib.util, json, os, time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('runner', '/source/tests/vm/run.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          manifest = json.loads((runner.STATE / 'review.json').read_text())
          runner.validate_review(manifest,
              '7be97c3b7bcaa0a50cd4d1a39cff98dc6105f5a19d2010caad4d07aa6a91aef8',
              'ed20b81bb265c6549f47ecd5b978ac1affe0b79e694ed25da8f1e62381266fa9',
              'fa95a619c62e5692661d0991a855249186ae4138')
          assert manifest['qemu_sha256'] == runner.sha('/usr/bin/qemu-system-x86_64')
          assert manifest['host_architecture'] == os.uname().machine
          assert manifest['cpu_model'] == runner.KVM_CPU
          assert manifest['acceleration'] == runner.acceleration()['selected'] == 'kvm'
          baseline = json.loads((runner.STATE / 'baseline.json').read_text())
          started = time.monotonic()
          vm = runner.VM(restore=True)
          try:
              restored = runner.export('cross-run-restored', vm.ready(180))
              assert all(restored[key] == baseline[key] for key in ('baseline', 'review', 'inventory'))
              result = dict(passed=True, elapsed_seconds=time.monotonic() - started,
                            source=manifest['source_revision'], scope='Read-only KVM restore/capture; no authorization or install')
              runner.write(runner.STATE / 'cross-run-check.json', result)
              print(json.dumps(result), flush=True)
          finally:
              vm.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvm-cross-run-restore
          path: |
            vm-state/*check.json
            vm-state/*restored.json
            vm-state/*.png
            vm-state/*.log
            vm-state/runner-cpu.txt
            vm-state/execution.json
          retention-days: 7
