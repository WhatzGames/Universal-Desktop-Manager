name: Initialize roadmap tracking
on:
  push:
    branches: [setup/v0.1-foundation]
    paths: [.github/workflows/setup-tracking.yml]
permissions:
  issues: write
jobs:
  milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const phases = [
              ['v0.1', 'Foundation and discovery'],
              ['v0.2', 'KDE installation'],
              ['v0.3', 'Native session activation'],
              ['v0.4', 'Persistent Wayland compositor'],
              ['v0.5', 'Integrated live shells'],
              ['v0.6', 'X11 support and nested-session prototypes'],
              ['v0.7–v0.9', 'Expand and harden'],
              ['v1.0', 'Stable release']
            ];
            const existing = await github.paginate(github.rest.issues.listMilestones, {...repo, state: 'all'});
            let foundation;
            for (const [title, phase] of phases) {
              let milestone = existing.find(m => m.title === title);
              if (!milestone) {
                const {data} = await github.rest.issues.createMilestone({...repo, title,
                  description: `${phase}. Planned milestone, not a released version. Scope and acceptance: docs/development/roadmap.md.`});
                milestone = data;
              }
              if (title === 'v0.1') foundation = milestone.number;
              core.info(`${title}: ${milestone.html_url}`);
            }
            for (let issue_number = 2; issue_number <= 9; issue_number++) {
              await github.rest.issues.update({...repo, issue_number, milestone: foundation});
            }
            await github.rest.issues.update({...repo, issue_number: 1, milestone: foundation});
